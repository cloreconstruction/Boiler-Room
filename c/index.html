<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171410">
<!-- 🔔 v6.68 — a Home Screen copy of this page is what lets an iPhone deliver pings; the manifest
     link (per client code) is added by the script below once the code is known -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Project">
<title>Clore Construction — Project</title>
<style>
  :root { --bg: #171410; --card: #201c15; --line: #3a3226; --gold: #c9a24b; --ink: #efe7d5; --ink2: #b0a488; }
  /* ☀ v5.19 — light mode: same brass, daylight paper */
  [data-theme="light"] { --bg: #f3eee2; --card: #fffdf6; --line: #d9cdb2; --gold: #8a6a1f; --ink: #2b2416; --ink2: #6d5f42; }
  * { box-sizing: border-box; }
  /* 🌙 v6.33 — paint the root dark before anything else: this page loads inside the app's
     preview frame and used to show the browser's white until its CSS arrived. */
  html { background: var(--bg); }
  /* 👁 v7.40 — the v6.61 owner bars and the v6.96 dashed edges are gone: this page is the homeowner's page and nothing
     else, inside Eric's viewer too. Which parts show is set in the app (the portal's 🎛 What they see window). */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--gold); padding-bottom: 12px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 1.5px; color: var(--gold); font-weight: 800; }
  .upd { color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
  .theme-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 3px 10px; font-size: 13px; cursor: pointer; margin-left: 8px; }
  h2 { font-size: 24px; margin: 14px 0 2px; }
  .stage { display: inline-block; border: 2px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 13.5px; letter-spacing: .8px; margin: 6px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 1.4px; color: var(--ink2); font-weight: 800; }
  .money { display: flex; gap: 10px; flex-wrap: wrap; }
  .m { flex: 1 1 30%; min-width: 130px; }
  .m .v { font-size: 22px; font-weight: 800; }
  .m .l { font-size: 12px; color: var(--ink2); letter-spacing: .6px; }
  .ph { border-top: 1px solid var(--line); padding: 10px 0; }
  .ph:first-of-type { border-top: none; }
  .ph-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; cursor: pointer; }
  .ph-cats { display: none; color: var(--ink2); font-size: 14px; padding: 6px 0 2px 12px; }
  .ph.open .ph-cats { display: block; }
  .jr-shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .jr-shots img { height: 72px; width: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gal img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .foot { color: var(--ink2); font-size: 12.5px; text-align: center; margin-top: 26px; }
  .err { text-align: center; padding: 60px 20px; color: var(--ink2); }
  .lamp { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 999px;
    padding: 5px 14px; font-size: 12.5px; font-weight: 800; letter-spacing: .8px; color: var(--ink2); margin: 0 0 14px; }
  .lamp .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .lamp.lit { border-color: var(--gold); color: var(--gold); }
  .lamp.lit .dot { background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: lampPulse 2s ease-in-out infinite; }
  @keyframes lampPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .lamp.lit .dot { animation: none; } }
  .soon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .soon { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    padding: 18px 8px 14px; text-align: center; cursor: default; overflow: hidden; }
  .soon.live { cursor: pointer; border-color: var(--gold); }
  .soon .ic { font-size: 26px; }
  .soon .t { font-weight: 700; font-size: 13.5px; margin-top: 6px; }
  .soon .s { color: var(--ink2); font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .soon .inner { opacity: .38; pointer-events: none; }
  .soon.live .inner { opacity: 1; }
  .ribbon { position: absolute; top: 14px; right: -34px; transform: rotate(35deg); background: var(--gold); color: #201c15;
    font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 3px 36px; }
  .tagchip { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
  .tagchip.sel { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .ask-ta { width: 100%; min-height: 90px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
  .send-btn { margin-top: 10px; width: 100%; border: none; border-radius: 10px; background: var(--gold); color: #201c15; font-weight: 800; font-size: 15px; padding: 12px; cursor: pointer; }
  /* 🔔 v6.68 — the pings switch: one line of words, one plain button */
  .bell { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bell .s { color: var(--ink2); font-size: 13.5px; line-height: 1.45; flex: 1 1 210px; }
  .bell .bell-btn { margin: 0; width: auto; flex: 0 0 auto; padding: 10px 16px; min-height: 44px; }
  @media (max-width: 420px) { .soon-grid { grid-template-columns: 1fr 1fr; } .soon:last-child { grid-column: 1 / -1; } }
  /* 📋 v5.35 — the materials board is its own FULL SCREEN, not a card squeezed between boxes */
  #matCard.fs { position: fixed; inset: 0; z-index: 150; margin: 0; border: none; border-radius: 0;
    background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; display: block;
    padding: 0 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .mat-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .mat-head h3 { margin: 0; }
  /* 🖼 v6.50 — OPTION BOARDS. A poster is a wide picture full of small labels, so it gets the
     full width of the card and opens in the lightbox to pinch. Tick boxes are big enough for a
     thumb (44px) and say what they are in words, never by colour alone. */
  .bd-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .bd-row:first-of-type { border-top: 0; }
  .bd-row img, .bd-noimg { width: 62px; height: 46px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: rgba(0,0,0,.15); }
  .bd-noimg { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .bd-row-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .bd-row-t .hint { margin: 0; }
  .bd-go { flex: 0 0 auto; color: var(--gold); font-size: 22px; font-weight: 800; }
  .bd-poster { width: 100%; border-radius: 10px; margin: 6px 0 2px; cursor: zoom-in; display: block; }
  .bd-grp { margin-top: 14px; }
  .bd-grp-n { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
  .bd-opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.3; }
  .bd-opt input { width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--gold); }
  .bd-opt.on { border-color: var(--gold); background: rgba(190,150,70,.10); font-weight: 700; }
  .bd-opt.on span::after { content: ' ✓ picked'; font-size: 11.5px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
  .bd-done { margin: 10px 0 2px; padding: 9px 11px; border: 1px solid var(--gold); border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
  .send-btn.bd-call { margin-top: 8px; background: none; border: 1px solid var(--line); color: var(--ink); }
  .mat-close { border: none; border-radius: 999px; background: var(--gold); color: #201c15; font-weight: 800;
    padding: 10px 18px; cursor: pointer; font-size: 14px; font-family: inherit; }
  /* 💰 v5.91 — tap-to-choose budget options: the lit one is YOUR PICK, spelled out */
  /* 🧾 v6.04 — what an option IS belongs inside its own box: the description lives within the
     dashed border with the name and the price, so the whole choice reads as one thing. */
  .opt-pick { display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: 100%; text-align: left;
    border: 2px dashed var(--line); background: none; color: var(--ink); border-radius: 10px;
    padding: 9px 12px; font: inherit; font-size: 14px; cursor: pointer; margin-top: 6px; opacity: .8; }
  .opt-pick .op-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .opt-pick .op-d { font-size: 12.5px; font-weight: 400; line-height: 1.35; opacity: .82; }
  .opt-pick.sel { border-style: solid; border-color: var(--gold); color: var(--gold); font-weight: 800; opacity: 1; }
  .opt-pick .op-r { white-space: nowrap; font-weight: 800; }
  .opt-hint { font-size: 12px; color: var(--ink2); margin-top: 6px; }
  .opt-desc { font-size: 12.5px; color: var(--ink2); margin: 3px 4px 0 14px; line-height: 1.4; }
  .opt-prompt { border: 2px solid var(--gold); color: var(--gold); border-radius: 10px; padding: 7px 12px;
    font-weight: 800; font-size: 12.5px; letter-spacing: .6px; margin-top: 8px; text-align: center; }
  /* 🔒 v5.93 — lock it in: the definitive "this is my choice" word to the builder */
  .opt-lockbtn { display: block; width: 100%; margin-top: 8px; border: none; border-radius: 10px;
    background: var(--gold); color: #201c15; font-weight: 800; font-size: 14px; padding: 11px; cursor: pointer; font-family: inherit; }
  .opt-unlock { display: block; margin: 6px auto 0; border: 1px solid var(--line); background: none; color: var(--ink2);
    border-radius: 999px; padding: 5px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .opt-locked { border: 2px solid var(--gold); color: var(--gold); border-radius: 10px; padding: 8px 12px;
    font-weight: 800; font-size: 13px; margin-top: 8px; text-align: center; }
  .opt-pick.lkd { opacity: .55; cursor: default; }
  .bud-total { font-size: 27px; font-weight: 900; letter-spacing: .5px; line-height: 1.15; }
  .bud-total-l { font-size: 11.5px; color: var(--ink2); letter-spacing: 1px; font-weight: 800; margin-bottom: 6px; }
  /* ≈ v7.46 — PLACEHOLDER NUMBERS. Eric: "The client page on the estimates coming in needs to make clear that they're placeholder
     numbers so that people don't panic when they're too high or weirdly low." A placeholder wears ≈ in front of its number, the
     word PLACEHOLDER under its name and a dashed edge down its side — the glyph, the word and the edge, never the colour alone —
     and the card says what ≈ means before its first line. */
  /* 🧱 v7.61 — every line of ESTIMATED REMAINING COSTS is its own plate. Eric, with the card on a phone (the bars reading as
     dividers, the lines running together): "need better seperation on the categories" — the same ask as his own board got in
     v7.57. An edge all round, a radius, room between, a faint plate colour; the placeholder's dashed edge and the finished
     line's solid edge stay as that plate's left edge; the bar wears an outline so it reads as a gauge, never as a rule. */
  .bud-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px !important; margin: 10px 0 !important;
    background: color-mix(in srgb, var(--ink) 4%, var(--card)); }
  .bud-row .bud-bar { outline: 1px solid color-mix(in srgb, currentColor 22%, transparent); outline-offset: 1px; margin-top: 8px !important; }
  .bud-row.bud-ph { border-left: 4px dashed var(--gold); padding: 4px 0 4px 10px; }
  .bud-ph-tag { margin-top: 3px; font-size: 11.5px; font-weight: 800; letter-spacing: .5px; color: var(--gold); line-height: 1.35; }
  .bud-ph-note { border: 2px dashed var(--gold); border-radius: 10px; padding: 9px 12px; margin: 8px 0 4px; font-size: 13.5px; line-height: 1.45; }
  .bud-ph-note b { color: var(--gold); letter-spacing: .4px; }
  /* ✓ v7.50 — a line Clore Construction marked COMPLETE: the word, a solid edge down its side, and the part of the bar that was
     never needed struck through — the glyph, the word and the edge, never the colour alone */
  .bud-row.bud-done { border-left: 4px solid var(--gold); padding: 4px 0 4px 10px; }
  .bud-done-tag { margin-top: 3px; font-size: 11.5px; font-weight: 800; letter-spacing: .5px; line-height: 1.35; }
  .bud-bar.done { background: repeating-linear-gradient(135deg, color-mix(in srgb, currentColor 26%, transparent) 0 3px, transparent 3px 7px) !important; }
  /* ⏳ v7.61 — SAVE FOR LATER. Eric: "click a button next to categories that I put the button on and it'll say 'save for later'
     … so it can be saved for last or next year and save money now. make it so it comes off the estimated and onto a for later
     window." The button is on a line (or a part of one) only where Clore Construction offered it; a tap moves it to the
     ⏳ SAVED FOR LATER card, where ↩ puts it back. 🔄 UPDATED — a line whose number changed says so, with the builder's why. */
  .bud-later-btn { display: block; width: 100%; margin-top: 7px; min-height: 44px; border: 2px dashed var(--gold); border-radius: 10px;
    background: none; color: var(--ink); font-weight: 800; font-size: 13.5px; padding: 9px 12px; cursor: pointer; font-family: inherit; text-align: center; }
  .bud-part { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .bud-part .bud-later-btn { width: auto; margin: 0; min-height: 40px; padding: 7px 12px; }
  .bud-upd { margin-top: 4px; padding: 6px 10px; border: 1.5px dashed var(--gold); border-radius: 8px; font-size: 12.5px; line-height: 1.4; }
  .bud-upd b { color: var(--gold); letter-spacing: .4px; }
  .lt-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin: 10px 0; padding: 9px 12px;
    border: 1.5px solid var(--line); border-radius: 12px; }
  .lt-name { font-weight: 700; font-size: 14px; }
  .lt-amt { font-weight: 800; white-space: nowrap; font-size: 14px; }
  .lt-meta { font-size: 12px; color: var(--ink2); margin-top: 3px; width: 100%; }
  .lt-back { display: block; width: 100%; margin-top: 6px; min-height: 40px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink);
    font-weight: 700; font-size: 13px; padding: 7px 12px; cursor: pointer; font-family: inherit; }
  /* 📅 v7.68 — WHERE WE ARE: the plan's steps in order, each with a glyph AND a word — ✓ done · ▸ UNDER WAY · ○ ahead — never the
     colour alone, and no dates on purpose (timing moves with the weather and the subs). Clore Construction switches it on per job. */
  .sw-sub { font-size: 11.5px; color: var(--ink2); letter-spacing: 1px; font-weight: 800; margin-bottom: 8px; }
  .sw-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; margin: 6px 0;
    border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
  .sw-row.sw-now { border: 2px solid var(--gold); font-weight: 800; }
  .sw-row.sw-done { opacity: .62; }
  .sw-g { font-weight: 900; text-align: center; }
  .sw-w { font-size: 11px; letter-spacing: .8px; font-weight: 800; color: var(--ink2); white-space: nowrap; }
  .sw-row.sw-now .sw-w { color: var(--gold); }
  .sw-foot { font-size: 12px; color: var(--ink2); margin-top: 8px; line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Loading your project…</div></div>
<script>
const code = new URLSearchParams(location.search).get('c') || location.hash.slice(1);
// 👁 pv=1 = Eric previewing from inside his app — real page, but his taps don't count
const PV = !!new URLSearchParams(location.search).get('pv');
// 👁 v7.40 — owner mode is gone. Eric: "on the client view take out the blue dotted boxes off, id rather setup which
// functions they see or dont on a different page." The v6.61 bars (✓ THEY SEE THIS / ✎ Edit / ➕ Add photos) and the v6.96
// dashed edges no longer draw: Eric's viewer shows this page exactly as the homeowner gets it, and an office crew phone's
// viewer is the same page. The switches live in the app — the portal's 🎛 What they see window — which writes the same
// page.show / boardsOff keys this page has always read. A stray &owner=1 from an older app draws nothing extra.
const $ = s => document.querySelector(s);
const money = n => '$' + (+n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const FN = '/.netlify/functions/client-portal';
const photoUrl = n => FN + '?c=' + encodeURIComponent(code) + '&p=' + encodeURIComponent(n);
function ping(ev) {
  if (PV) return; // preview looks stay out of the tallies
  try { fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ c: code, ev }) }); } catch (e) {}
}
// 📷 photos open right here in a lightbox — never a new tab (phones get stuck out there)
function shotOpen(u) {
  let d = $('#shotBox');
  if (!d) {
    d = document.createElement('div'); d.id = 'shotBox';
    d.style.cssText = 'display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.92);flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer;';
    d.innerHTML = '<img id="shotImg" alt="photo" style="max-width:100%;max-height:88%;border-radius:8px;">' +
      '<div style="color:#fff;font-weight:800;letter-spacing:1px;font-size:13px;margin-top:14px;">✕ TAP ANYWHERE TO CLOSE</div>';
    d.onclick = () => { d.style.display = 'none'; $('#shotImg').src = ''; };
    document.body.appendChild(d);
  }
  $('#shotImg').src = u;
  d.style.display = 'flex';
  ping('photo:open');
}
// ☀☾ theme: remembered per device; default follows the phone's own setting
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('clore-theme', t); } catch (e) {}
  const b = $('#themeBtn'); if (b) b.textContent = t === 'light' ? '☾ Dark' : '☀ Light';
}
function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); ping('theme'); }
// 🔔 v6.68 — HOMEOWNER PINGS, opt-in. Eric's spec (parked since v6.35, built on his "do 1-5"):
// two triggers only — a journal entry posted, the budget changed; fixed words on the server, no
// name and no dollar figure on a lock screen; 9am–5pm Alaska; and THIS phone's subscription
// lives in the client's own file, never with Eric's or the crew's. Same public key as the app —
// the server signs with its private half. In Eric's preview (pv=1) the switch is shown as words
// only, so his own phone can never end up on a homeowner's list by a stray tap.
const VAPID_PUBLIC = 'BMreGdBGDcLJCWcNsDd6ClX-NhievSimv25Rw1kxH1w_VJ3hJ-7eH9mpd1h0_HJBMmwlod7G_TvD4TbdGVXJnCo';
function b64ToU8(s) { const pad = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); }
const bellKey = () => 'clore-bell-' + code;
function bellState() { try { return localStorage.getItem(bellKey()) || ''; } catch (e) { return ''; } }
const BELL_ON = '✓ On — this phone gets a ping when a journal entry is posted or the budget changes. Only that, and only between 9am and 5pm.';
const BELL_OFF = 'Get a ping on this phone when a journal entry is posted or the budget changes. Nothing else, and only between 9am and 5pm.';
const iosHome = () => /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone;
function bellHtml() {
  if (PV) return `<div class="card" id="bellCard"><h3>🔔 PINGS</h3><div class="bell"><div class="s">This is the homeowner's switch — it works on their phone, not here. When it is on, they get a ping when you post a journal entry or change the budget, 9am to 5pm.</div></div></div>`;
  const on = bellState() === 'on';
  return `<div class="card" id="bellCard"><h3>🔔 PINGS</h3><div class="bell"><div class="s" id="bellTxt">${on ? BELL_ON : BELL_OFF + (iosHome() ? ' On an iPhone: first add this page to your Home Screen (Share → Add to Home Screen) and open it from there.' : '')}</div>
    <button type="button" class="send-btn bell-btn" id="bellBtn" onclick="bellTap()">${on ? 'Turn off' : 'Turn on'}</button></div></div>`;
}
async function bellTap() {
  const txt = $('#bellTxt'), btn = $('#bellBtn');
  const say = s => { if (txt) txt.textContent = s; };
  if (bellState() === 'on') {
    try {
      const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration('/sw.js') : null;
      const sub = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
      if (sub) {
        await fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ c: code, push: { off: sub.endpoint } }) });
        try { await sub.unsubscribe(); } catch (e) {}
      }
    } catch (e) {}
    try { localStorage.removeItem(bellKey()); } catch (e) {}
    say('Off — no more pings on this phone.'); if (btn) btn.textContent = 'Turn on'; ping('bell:off'); return;
  }
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      say("This browser can't do pings." + (iosHome() ? ' On an iPhone: Share → Add to Home Screen, then open the page from there and tap again.' : '')); return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();

      <div class="m"><div class="v">${money(d.paid)}</div><div class="l">PAID — THANK YOU</div></div>
      <div class="m${brk ? '" style="cursor: pointer;" onclick="event.stopPropagation(); document.getElementById(\'obBrk\').classList.toggle(\'open\'); ping(\'money:openbrk\')"' : '"'}>
        <div class="v">${money(d.open)}</div><div class="l">OPEN BALANCE${brk ? ' · ▾ TAP — WHAT IT\'S FOR' : ''}</div></div>
    </div>
    ${brk ? `<div class="ph" id="obBrk" style="margin-top: 10px;">
      <div class="ph-head" onclick="event.stopPropagation(); document.getElementById('obBrk').classList.toggle('open'); ping('money:openbrk')">
        <span>WHAT THE OPEN BALANCE COVERS</span><span>${money(d.open)}</span></div>
      <div class="ph-cats">${d.openBrk.map(c => `${esc(c[0])} — ${money(c[1])}`).join('<br>')}
        <br><span style="opacity:.75">Your invoice is the itemized record — this is the quick picture of what's on it.</span></div>
    </div>` : ''}</div>`;
  }
  // 🧾 v7.45 — the money reads top to bottom in the order it happens: invoiced (above) · the receipts received and not on an
  // invoice yet · the estimated costs remaining. (v6.27 had the receipts under the budget.)
  if (sh('upcoming')) h += upcomingHtml(d);
  // 💰 approved estimates — the card lives in budgetHtml() so a pick can redraw it in place
  // 👁 v6.61 — both cards now answer to a per-client switch, like the rest
  if (sh('budget')) {
    const bh = budgetHtml(d);
    // 👁 v6.64 — Eric: "what about the estimates? is that only on there once i enter an estimate
    // in?" Yes: the card exists for the homeowner only once a lamp is lit with a number on it.
    h += bh || '';
  }
  if (d.show && d.show.phases && (d.phases || []).length) {
    h += `<div class="card" id="phasesCard"><h3>WORK BY PHASE — tap a phase for detail</h3>` +
      d.phases.map((p, i) => `<div class="ph" id="ph${i}"><div class="ph-head" onclick="document.getElementById('ph${i}').classList.toggle('open'); ping('phase:${esc(p.name).slice(0, 20)}')">
        <span>${p.n ? p.n + '. ' : ''}${esc(p.name)}</span><span>${money(p.total)}</span></div>
        <div class="ph-cats">${(p.cats || []).map(c => `${esc(c[0])} — ${money(c[1])}`).join('<br>')}</div>
      </div>`).join('') + `</div>`;
  }
  // ⏳ v7.62 — what they saved for later: the LAST card about the job, at the bottom (Eric: "make it go to a window at the bottom
  // that is not counted in the total remaining cost but they still need to be able to see it and put it back on if needed");
  // v7.61 had it right under the remaining costs. Only while they hold something.
  if (sh('budget')) h += laterHtml(d);
  h += bellHtml();   // 🔔 v6.68 — the pings switch, last card before the foot
  h += `<button class="theme-btn" style="display: block; margin: 22px auto 0;" onclick="openFeedback()">💬 App feedback — what works, what doesn't</button>
    <div class="foot">${sh('ask') ? 'Questions? Use 💬 Ask / Remark above, or call or text Eric directly.' : 'Questions? Call or text Eric directly.'}</div>`;
  $('#app').innerHTML = h;
  if (sh('ask')) loadAsks(false); // 💬 their open questions + the three lamps
  // 📋 the materials board comes alive when Eric has published one
  loadMat().then(() => {
    if (!_mat || !_mat.rooms.length) return;
    const tile = document.getElementById('matTile');
    const rib = document.getElementById('matRibbon');
    if (rib) rib.remove();
    if (tile) { tile.classList.add('live'); tile.onclick = () => { renderMat(); matOpenFS(); }; }
    updateMatTile();
  });
  // 🖼 v6.50 — the Options tile lights on its own, whether or not there is a Build List
  if (sh('boards')) boardsLoad().then(boardTile);
  ping('open');
}
boot();
</script>
</body>
</html>
