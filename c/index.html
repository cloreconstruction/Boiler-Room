<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Clore Construction — Project</title>
<style>
  :root { --bg: #171410; --card: #201c15; --line: #3a3226; --gold: #c9a24b; --ink: #efe7d5; --ink2: #b0a488; }
  /* ☀ v5.19 — light mode: same brass, daylight paper */
  [data-theme="light"] { --bg: #f3eee2; --card: #fffdf6; --line: #d9cdb2; --gold: #8a6a1f; --ink: #2b2416; --ink2: #6d5f42; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--gold); padding-bottom: 12px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 1.5px; color: var(--gold); font-weight: 800; }
  .upd { color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
  .theme-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 3px 10px; font-size: 13px; cursor: pointer; margin-left: 8px; }
  h2 { font-size: 24px; margin: 14px 0 2px; }
  .stage { display: inline-block; border: 2px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 13.5px; letter-spacing: .8px; margin: 6px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 1.4px; color: var(--ink2); font-weight: 800; }
  .money { display: flex; gap: 10px; flex-wrap: wrap; }
  .m { flex: 1 1 30%; min-width: 130px; }
  .m .v { font-size: 22px; font-weight: 800; }
  .m .l { font-size: 12px; color: var(--ink2); letter-spacing: .6px; }
  .ph { border-top: 1px solid var(--line); padding: 10px 0; }
  .ph:first-of-type { border-top: none; }
  .ph-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; cursor: pointer; }
  .ph-cats { display: none; color: var(--ink2); font-size: 14px; padding: 6px 0 2px 12px; }
  .ph.open .ph-cats { display: block; }
  .jr-shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .jr-shots img { height: 72px; width: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gal img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .foot { color: var(--ink2); font-size: 12.5px; text-align: center; margin-top: 26px; }
  .err { text-align: center; padding: 60px 20px; color: var(--ink2); }
  .lamp { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 999px;
    padding: 5px 14px; font-size: 12.5px; font-weight: 800; letter-spacing: .8px; color: var(--ink2); margin: 0 0 14px; }
  .lamp .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .lamp.lit { border-color: var(--gold); color: var(--gold); }
  .lamp.lit .dot { background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: lampPulse 2s ease-in-out infinite; }
  @keyframes lampPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .lamp.lit .dot { animation: none; } }
  .soon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .soon { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    padding: 18px 8px 14px; text-align: center; cursor: default; overflow: hidden; }
  .soon.live { cursor: pointer; border-color: var(--gold); }
  .soon .ic { font-size: 26px; }
  .soon .t { font-weight: 700; font-size: 13.5px; margin-top: 6px; }
  .soon .s { color: var(--ink2); font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .soon .inner { opacity: .38; pointer-events: none; }
  .soon.live .inner { opacity: 1; }
  .ribbon { position: absolute; top: 14px; right: -34px; transform: rotate(35deg); background: var(--gold); color: #201c15;
    font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 3px 36px; }
  .tagchip { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
  .tagchip.sel { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .ask-ta { width: 100%; min-height: 90px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
  .send-btn { margin-top: 10px; width: 100%; border: none; border-radius: 10px; background: var(--gold); color: #201c15; font-weight: 800; font-size: 15px; padding: 12px; cursor: pointer; }
  @media (max-width: 420px) { .soon-grid { grid-template-columns: 1fr 1fr; } .soon:last-child { grid-column: 1 / -1; } }
  /* 📋 v5.35 — the materials board is its own FULL SCREEN, not a card squeezed between boxes */
  #matCard.fs { position: fixed; inset: 0; z-index: 150; margin: 0; border: none; border-radius: 0;
    background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; display: block;
    padding: 0 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .mat-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .mat-head h3 { margin: 0; }
  .mat-close { border: none; border-radius: 999px; background: var(--gold); color: #201c15; font-weight: 800;
    padding: 10px 18px; cursor: pointer; font-size: 14px; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Loading your project…</div></div>
<script>
const code = new URLSearchParams(location.search).get('c') || location.hash.slice(1);
// 👁 pv=1 = Eric previewing from inside his app — real page, but his taps don't count
const PV = !!new URLSearchParams(location.search).get('pv');
const $ = s => document.querySelector(s);
const money = n => '$' + (+n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const FN = '/.netlify/functions/client-portal';
const photoUrl = n => FN + '?c=' + encodeURIComponent(code) + '&p=' + encodeURIComponent(n);
function ping(ev) {
  if (PV) return; // preview looks stay out of the tallies
  try { fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ c: code, ev }) }); } catch (e) {}
}
// 📷 photos open right here in a lightbox — never a new tab (phones get stuck out there)
function shotOpen(u) {
  let d = $('#shotBox');
  if (!d) {
    d = document.createElement('div'); d.id = 'shotBox';
    d.style.cssText = 'display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.92);flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer;';
    d.innerHTML = '<img id="shotImg" alt="photo" style="max-width:100%;max-height:88%;border-radius:8px;">' +
      '<div style="color:#fff;font-weight:800;letter-spacing:1px;font-size:13px;margin-top:14px;">✕ TAP ANYWHERE TO CLOSE</div>';
    d.onclick = () => { d.style.display = 'none'; $('#shotImg').src = ''; };
    document.body.appendChild(d);
  }
  $('#shotImg').src = u;
  d.style.display = 'flex';
  ping('photo:open');
}
// ☀☾ theme: remembered per device; default follows the phone's own setting
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('clore-theme', t); } catch (e) {}
  const b = $('#themeBtn'); if (b) b.textContent = t === 'light' ? '☾ Dark' : '☀ Light';
}
function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); ping('theme'); }
(() => {
  let t = null;
  try { t = localStorage.getItem('clore-theme'); } catch (e) {}
  if (!t) t = matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
let askTag = 'General';
function pickTag(t, el) {
  askTag = t;
  document.querySelectorAll('.tagchip').forEach(x => x.classList.toggle('sel', x === el));
}
// 💬 v5.25 — send as many as you like: each ask is its own item with three lamps.
// ● SENT the moment it goes · ● ON IT when Eric lights it · ● ANSWERED with his words below.
async function sendAsk() {
  const ta = $('#askTa');
  const text = (ta.value || '').trim();
  if (!text) { ta.focus(); return; }
  $('#askSend').disabled = true; $('#askSend').textContent = 'Sending…';
  try {
    const r = await fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ c: code, ask: { tag: askTag, text } }) });
    if (!r.ok) throw new Error();
    ta.value = '';
    $('#askSend').disabled = false; $('#askSend').textContent = 'Send it';
    loadAsks(true);
  } catch (e) {
    $('#askSend').disabled = false; $('#askSend').textContent = 'Send it';
    alert('Couldn\'t send just now — try again in a minute.');
  }
}
const lampRow = a => {
  const answered = !!a.answer || a.done;
  const l = (on, word) => `<span style="display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 11px; font-weight: 800; letter-spacing: .5px; color: ${on ? 'var(--gold)' : 'var(--ink2)'}; opacity: ${on ? 1 : 0.55};"><span style="width: 8px; height: 8px; border-radius: 50%; background: ${on ? 'var(--gold)' : 'var(--line)'}; ${on ? 'box-shadow: 0 0 6px var(--gold);' : ''}"></span>${on ? '✓ ' : ''}${word}</span>`;
  return l(true, 'SENT') + l(!!a.onit, 'ON IT') + l(answered, 'ANSWERED');
};
async function loadAsks(justSent) {
  const box = $('#askList');
  if (!box) return;
  let arr = [];
  try { arr = await (await fetch(FN + '?c=' + encodeURIComponent(code) + '&a=1')).json(); } catch (e) {}
  if (!Array.isArray(arr)) arr = [];
  const cutoff = Date.now() - 14 * 86400000;
  const show = arr.filter(a => a && (!a.done || (a.doneTs && +new Date(a.doneTs) > cutoff))).slice(0, 10);
  const esc2 = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  box.innerHTML = (justSent ? '<div style="color: var(--gold); font-weight: 700; margin: 8px 0 4px;">✓ Sent — ask another any time.</div>' : '') +
    show.map(a => `<div style="border-top: 1px solid var(--line); padding: 10px 0;">
      <div style="font-size: 14px; margin-bottom: 5px;">${a.tag && a.tag !== 'General' ? '<b>' + esc2(a.tag) + ':</b> ' : ''}${esc2(a.text)}</div>
      <div>${lampRow(a)}</div>
      ${a.answer ? `<div style="margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--gold); background: rgba(128,128,128,0.06); white-space: pre-wrap;"><b>Here's your answer:</b><br>${esc2(a.answer)}</div>` : ''}
    </div>`).join('');
}
// 💬 v5.26 — feedback rides the ask channel with its own tag, straight to Eric's pile
function openFeedback() {
  askTag = 'Feedback';
  const card = $('#askCard');
  card.style.display = '';
  document.querySelectorAll('.tagchip').forEach(x => x.classList.remove('sel'));
  const ta = $('#askTa');
  if (ta) { ta.placeholder = 'App feedback — what works, what doesn\'t, what\'s missing? This page is young; your take shapes it.'; ta.focus(); }
  card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ping('feedback:open');
}
function toggleCard(id, ev) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? '' : 'none';
  if (el.style.display !== 'none') { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); ping(ev); }
}
// 📋 v5.28 — THE MATERIALS BOARD. Rooms fold like phases; every item wears four lamps:
// YOUR PICK (glows when the ball's in your court) → PICKED → ORDERED → ARRIVED.
// Grouped orders (like a full window order) go green + READY TO ORDER when every piece confirms.
let _mat = null, _matOpenItem = '';
// v5.36 — room folds live in STATE: every item tap redraws the board, and the redraw
// used to slam the room shut again (Eric: "it alternates every time I click")
let _matOpenRooms = new Set();
function matRoomTog(ri) { _matOpenRooms.has(ri) ? _matOpenRooms.delete(ri) : _matOpenRooms.add(ri); renderMat(); ping('mat:room'); }
const esc3 = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function matLamp(on, word, glow) {
  return `<span style="display: inline-flex; align-items: center; gap: 3px; margin-right: 8px; font-size: 10px; font-weight: 800; letter-spacing: .4px; color: ${on ? 'var(--gold)' : 'var(--ink2)'}; opacity: ${on ? 1 : 0.45};"><span style="width: 7px; height: 7px; border-radius: 50%; background: ${on ? 'var(--gold)' : 'var(--line)'}; ${glow && on ? 'box-shadow: 0 0 6px var(--gold); animation: lampPulse 2s ease-in-out infinite;' : ''}"></span>${on ? '✓' : ''}${word}</span>`;
}
function matLampRow(it) {
  const kidsReady = (it.kids || []).length > 0 && it.kids.every(k => k.ok);
  const s = it.s || 'pick';
  const past = st => ['pick', 'picked', 'ordered', 'arrived'].indexOf(s) >= ['pick', 'picked', 'ordered', 'arrived'].indexOf(st);
  return matLamp(s === 'pick', 'YOUR PICK', true) + matLamp(s !== 'pick', 'PICKED') +
    matLamp(past('ordered') && s !== 'pick' && s !== 'picked', 'ORDERED') + matLamp(s === 'arrived', 'ARRIVED') +
    (kidsReady && s === 'pick' ? `<span style="font-size: 10px; font-weight: 800; color: var(--gold);">● READY TO ORDER</span>` : '');
}
async function loadMat() {
  try { _mat = await (await fetch(FN + '?c=' + encodeURIComponent(code) + '&mat=1')).json(); } catch (e) { _mat = null; }
  if (!_mat || !Array.isArray(_mat.rooms)) _mat = null;
  return _mat;
}
function matPickCount() {
  return _mat ? _mat.rooms.reduce((s, r) => s + (r.items || []).filter(i => (i.s || 'pick') === 'pick').length, 0) : 0;
}
function renderMat() {
  const box = document.getElementById('matBody');
  if (!box || !_mat) return;
  box.innerHTML = _mat.rooms.map((r, ri) => {
    const need = (r.items || []).filter(i => (i.s || 'pick') === 'pick').length;
    const ready = (r.items || []).filter(i => (i.kids || []).length && i.kids.every(k => k.ok)).length;
    return `<div class="ph${_matOpenRooms.has(ri) ? ' open' : ''}" id="mr${ri}">
      <div class="ph-head" onclick="matRoomTog(${ri})">
        <span>${esc3(r.name)}</span>
        <span style="font-size: 12px; font-weight: 800; color: ${need ? 'var(--gold)' : 'var(--ink2)'};">${need ? '● ' + need + ' need' + (need === 1 ? 's' : '') + ' your pick' : '✓ all set'}${ready ? ' · ● READY TO ORDER' : ''}</span>
      </div>
      <div class="ph-cats" style="padding-left: 4px;">${(r.items || []).map(it => matItemHtml(it)).join('')}</div>
    </div>`;
  }).join('');
}
function matItemHtml(it) {
  const open = _matOpenItem === it.id;
  const kids = it.kids || [];
  const okKids = kids.filter(k => k.ok).length;
  return `<div style="border-top: 1px dashed var(--line); padding: 8px 0;">
    <div style="cursor: pointer; color: var(--ink);" onclick="_matOpenItem = _matOpenItem === '${esc3(it.id)}' ? '' : '${esc3(it.id)}'; renderMat(); ping('mat:item')">
      <b>${esc3(it.n)}</b>${kids.length ? ` <span style="font-size: 11px; color: var(--ink2);">(${okKids}/${kids.length} confirmed)</span>` : ''}<br>${matLampRow(it)}
    </div>
    ${open ? `<div style="margin-top: 6px;">
      ${it.note ? `<div style="white-space: pre-wrap; margin-bottom: 6px;">${esc3(it.note)}</div>` : ''}
      ${it.pick ? `<div style="margin-bottom: 6px;">✓ <b>Picked:</b> ${esc3(it.pick)}${it.url ? ` · <a href="${esc3(it.url)}" target="_blank" rel="noopener" style="color: var(--gold);">see it ↗</a>` : ''}</div>` : it.url ? `<div style="margin-bottom: 6px;"><a href="${esc3(it.url)}" target="_blank" rel="noopener" style="color: var(--gold);">see it ↗</a></div>` : ''}
      ${(it.s === 'ordered' || it.s === 'arrived') && it.showEta && (it.odate || it.eta) ? `<div style="font-size: 12.5px; color: var(--ink2); margin-bottom: 6px;">${it.odate ? 'Ordered ' + esc3(it.odate) : ''}${it.eta ? ' · arriving ~' + esc3(it.eta) : ''}</div>` : ''}
      ${(it.opts || []).length && (it.s || 'pick') === 'pick' ? it.opts.map((o, oi) => `<div style="border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0;">
        ${esc3(o.t)}${o.price ? ' — ' + esc3(o.price) : ''}${o.url ? ` · <a href="${esc3(o.url)}" target="_blank" rel="noopener" style="color: var(--gold);">look ↗</a>` : ''}
        <button class="theme-btn" style="display: block; margin-top: 6px;" onclick="matPick('${esc3(it.id)}', ${oi})">✓ Pick this one</button>
      </div>`).join('') : ''}
      ${(it.s || 'pick') === 'pick' && !kids.length ? `<div style="margin: 6px 0;"><input type="text" id="mp-${esc3(it.id)}" placeholder="or type your pick…" style="width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);">
        <button class="theme-btn" style="margin-top: 6px;" onclick="matPickText('${esc3(it.id)}')">✓ That's my pick</button></div>` : ''}
      ${kids.length ? `<div style="margin: 6px 0;">${kids.map(k => `<div style="font-size: 13px; margin: 3px 0;"><span style="color: ${k.ok ? 'var(--gold)' : 'var(--ink2)'};">${k.ok ? '● ✓' : '○'}</span> ${esc3(k.n)}${k.note ? ` <span style="color: var(--ink2);">— ${esc3(k.note)}</span>` : ''}</div>`).join('')}
        ${kids.every(k => k.ok) ? `<div style="font-weight: 800; color: var(--gold); margin-top: 4px;">● ALL CONFIRMED — READY TO ORDER</div>` : `<div style="font-size: 12px; color: var(--ink2);">Eric confirms each piece as it's settled — all green means ready to order.</div>`}</div>` : ''}
      ${(it.remarks || []).slice(-4).map(rm => `<div style="font-size: 12.5px; color: var(--ink2); margin: 3px 0;">${rm.from === 'client' ? 'You' : 'Eric'}: ${esc3(rm.text)}</div>`).join('')}
      <div style="margin-top: 6px;"><input type="text" id="mr-${esc3(it.id)}" placeholder="question or remark on this item…" style="width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);">
        <button class="theme-btn" style="margin-top: 6px;" onclick="matRemark('${esc3(it.id)}')">💬 Send</button></div>
      <div style="margin-top: 8px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px;" ondragover="event.preventDefault()" ondrop="matDrop(event, '${esc3(it.id)}')">
        <input type="file" id="mf-${esc3(it.id)}" accept="image/*" style="display: none;" onchange="matPhoto('${esc3(it.id)}', this.files[0]); this.value = '';">
        <button class="theme-btn" onclick="document.getElementById('mf-${esc3(it.id)}').click()">📎 Send a picture of what you picked</button>
        <span style="font-size: 11.5px; color: var(--ink2);"> — or drag &amp; drop it here</span>
        <div id="mfs-${esc3(it.id)}" style="font-size: 12.5px; color: var(--gold); margin-top: 4px;"></div>
      </div>
    </div>` : ''}
  </div>`;
}
// 📋 v5.35 — the board takes the whole screen; ✕ Back (or Esc) returns to the tiles
function matOpenFS() {
  const el = document.getElementById('matCard');
  el.style.display = 'block'; el.classList.add('fs');
  document.body.style.overflow = 'hidden';
  el.scrollTop = 0;
  ping('mat:open');
}
function matCloseFS() {
  const el = document.getElementById('matCard');
  el.style.display = 'none'; el.classList.remove('fs');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const el = document.getElementById('matCard'); if (el && el.classList.contains('fs') && el.style.display !== 'none') matCloseFS(); }
});
// 📎 v5.35 — drop or pick a photo/screenshot of what they chose; it lands in Eric's review pile
async function matShrink(f) {
  const img = await createImageBitmap(f);
  const max = 1400;
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c2 = document.createElement('canvas');
  c2.width = Math.max(1, Math.round(img.width * sc));
  c2.height = Math.max(1, Math.round(img.height * sc));
  c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
  const blob = await new Promise(res => c2.toBlob(res, 'image/jpeg', 0.82));
  return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}
async function matPhoto(id, f) {
  if (!f || !(f.type || '').startsWith('image/')) return;
  const st = document.getElementById('mfs-' + id);
  if (st) st.textContent = '📎 sending your picture…';
  try {
    const b64 = await matShrink(f);
    const okd = await matPost({ id, photo: { n: (f.name || 'pick').slice(0, 60), b64 } });
    if (!okd) throw new Error();
    const it = matFind(id);
    if (it) it.remarks = [...(it.remarks || []), { from: 'client', text: '📎 sent a picture' }];
    renderMat();
    const st2 = document.getElementById('mfs-' + id);
    if (st2) st2.textContent = '✓ Sent — Clore Construction will take a look.';
  } catch (e) {
    if (st) st.textContent = "Couldn't send it — try again in a minute.";
  }
}
function matDrop(ev, id) {
  ev.preventDefault();
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) matPhoto(id, f);
}
function matFind(id) { for (const r of _mat.rooms) { const f = (r.items || []).find(x => x.id === id); if (f) return f; } }
async function matPost(body) {
  try { const r = await fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ c: code, mat: body }) }); return r.ok; } catch (e) { return false; }
}
async function matPick(id, oi) {
  const it = matFind(id);
  const o = (it.opts || [])[oi];
  if (!o) return;
  it.s = 'picked'; it.pick = o.t; if (o.url) it.url = o.url;
  renderMat(); updateMatTile();
  if (!await matPost({ id, pick: o.t })) alert("Couldn't send the pick — try again in a minute.");
}
async function matPickText(id) {
  const v = (document.getElementById('mp-' + id) || {}).value || '';
  if (!v.trim()) return;
  const it = matFind(id);
  it.s = 'picked'; it.pick = v.trim();
  renderMat(); updateMatTile();
  if (!await matPost({ id, pick: v.trim() })) alert("Couldn't send the pick — try again in a minute.");
}
async function matRemark(id) {
  const el = document.getElementById('mr-' + id);
  const v = (el && el.value || '').trim();
  if (!v) return;
  const it = matFind(id);
  it.remarks = [...(it.remarks || []), { from: 'client', text: v }];
  el.value = '';
  renderMat();
  if (!await matPost({ id, remark: v })) alert("Couldn't send it — try again in a minute.");
}
function updateMatTile() {
  const n = matPickCount();
  const s = document.getElementById('matTileSub');
  if (s) s.innerHTML = n ? `<b style="color: var(--gold);">● ${n} need your pick</b>` : 'lists & picks, all set ✓';
}
async function boot() {
  if (!code) { $('#app').innerHTML = '<div class="err">This link is missing its code — ask Clore Construction for a fresh one.</div>'; return; }
  let d;
  try {
    const r = await fetch(FN + '?c=' + encodeURIComponent(code));
    if (!r.ok) throw new Error();
    d = await r.json();
  } catch (e) {
    $('#app').innerHTML = '<div class="err">This project link isn\'t active. Ask Clore Construction for a current one.</div>';
    return;
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 💡 the lamp: LIT when the page got fresher since this client's last visit
  const seenKey = 'clore-seen-' + code;
  const lastSeen = localStorage.getItem(seenKey) || '';
  const fresh = (d.updated || '') > lastSeen;
  try { localStorage.setItem(seenKey, d.updated || ''); } catch (e) {}
  const allShots = (d.journal || []).flatMap(j => j.photos || []);
  let h = `<header><h1>CLORE CONSTRUCTION</h1><span class="upd">updated ${esc(d.updated || '')}<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">${document.documentElement.dataset.theme === 'light' ? '☾ Dark' : '☀ Light'}</button></span></header>
    <h2>${esc(d.name || 'Your project')}</h2>
    ${d.stage ? `<div class="stage">${esc(d.stage)}</div>` : ''}
    <div class="lamp${fresh ? ' lit' : ''}"><span class="dot"></span>${fresh ? 'UPDATED FOR YOU — ' + esc(d.updated || '') : 'CURRENT AS OF ' + esc(d.updated || '')}</div>
    <div class="soon-grid">
      ${allShots.length
        ? `<div class="soon live" onclick="toggleCard('photoCard', 'photos')"><div class="inner"><div class="ic">📷</div><div class="t">Photos</div><div class="s">${allShots.length} progress picture${allShots.length > 1 ? 's' : ''}</div></div></div>`
        : `<div class="soon" onclick="ping('soon:photos')"><div class="ribbon">UNDER CONSTRUCTION</div><div class="inner"><div class="ic">📷</div><div class="t">Photos</div><div class="s">progress pictures from the job</div></div></div>`}
      <div class="soon live" onclick="toggleCard('askCard', 'ask:open')"><div class="inner"><div class="ic">💬</div><div class="t">Ask / Remark</div><div class="s">tag it Phil · Eric · General</div></div></div>
      <div class="soon" id="matTile" onclick="ping('soon:materials')"><div class="ribbon" id="matRibbon">UNDER CONSTRUCTION</div><div class="inner"><div class="ic">📋</div><div class="t">Materials Board</div><div class="s" id="matTileSub">lists & picks, card by card</div></div></div>
    </div>
    <div class="card" id="matCard" style="display: none;"><div class="mat-head"><h3>📋 MATERIALS BOARD</h3><button class="mat-close" onclick="matCloseFS()">✕ Back</button></div><div id="matBody"></div></div>
    <div class="card" id="askCard" style="display: none;">
      <h3>💬 ASK OR REMARK</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <button class="tagchip" onclick="pickTag('Phil', this)">Phil</button>
        <button class="tagchip" onclick="pickTag('Eric', this)">Eric</button>
        <button class="tagchip sel" onclick="pickTag('General', this)">General</button>
      </div>
      <textarea class="ask-ta" id="askTa" placeholder="Ask a question or leave a remark — it goes straight to Eric's desk."></textarea>
      <button class="send-btn" id="askSend" onclick="sendAsk()">Send it</button>
      <div id="askList"></div>
    </div>
    ${allShots.length ? `<div class="card" id="photoCard" style="display: none;"><h3>📷 PROGRESS PHOTOS — newest first</h3>
      <div class="gal">${allShots.slice(0, 60).map(n => `<img loading="lazy" src="${photoUrl(n)}" alt="progress photo" onclick="shotOpen('${photoUrl(n)}')">`).join('')}</div>
    </div>` : ''}`;
  // 📖 the job journal: ONLY the latest week shows; older weeks live behind one fold
  if ((d.journal || []).length) {
    const js = d.journal.slice(0, 26);
    const shots = j => (j.photos || []).length
      ? `<div class="jr-shots">${j.photos.slice(0, 8).map(n => `<img loading="lazy" src="${photoUrl(n)}" alt="job photo" onclick="event.stopPropagation(); shotOpen('${photoUrl(n)}')">`).join('')}</div>` : '';
    h += `<div class="card"><h3>JOB JOURNAL</h3>
      <div class="ph open">
        <div class="ph-head"><span>📖 Week of ${esc(js[0].week)}</span></div>
        <div class="ph-cats" style="white-space: pre-wrap; padding-left: 4px;">${esc(js[0].text)}${shots(js[0])}</div>
      </div>` +
      (js.length > 1 ? `<div class="ph" id="jrPast">
        <div class="ph-head" onclick="document.getElementById('jrPast').classList.toggle('open'); ping('journal:past')">
          <span>▸ Past weeks (${js.length - 1})</span><span></span></div>
        <div class="ph-cats" style="padding-left: 0;">` +
        js.slice(1).map((j, i) => `<div class="ph" id="jr${i + 1}">
          <div class="ph-head" onclick="event.stopPropagation(); document.getElementById('jr${i + 1}').classList.toggle('open'); ping('journal')">
            <span>Week of ${esc(j.week)}</span><span>▾</span></div>
          <div class="ph-cats" style="white-space: pre-wrap;">${esc(j.text)}${shots(j)}</div>
        </div>`).join('') + `</div></div>` : '') + `</div>`;
  }
  if (d.show && d.show.money) {
    h += `<div class="card" onclick="ping('money')"><h3>WHERE IT STANDS</h3><div class="money">
      <div class="m"><div class="v">${money(d.invoiced)}</div><div class="l">INVOICED TO DATE</div></div>
      <div class="m"><div class="v">${money(d.paid)}</div><div class="l">PAID — THANK YOU</div></div>
      <div class="m"><div class="v">${money(d.open)}</div><div class="l">OPEN BALANCE</div></div>
    </div></div>`;
  }
  if (d.show && d.show.phases && (d.phases || []).length) {
    h += `<div class="card"><h3>WORK BY PHASE — tap a phase for detail</h3>` +
      d.phases.map((p, i) => `<div class="ph" id="ph${i}"><div class="ph-head" onclick="document.getElementById('ph${i}').classList.toggle('open'); ping('phase:${esc(p.name).slice(0, 20)}')">
        <span>${p.n ? p.n + '. ' : ''}${esc(p.name)}</span><span>${money(p.total)}</span></div>
        <div class="ph-cats">${(p.cats || []).map(c => `${esc(c[0])} — ${money(c[1])}`).join('<br>')}</div>
      </div>`).join('') + `</div>`;
  }
  h += `<button class="theme-btn" style="display: block; margin: 22px auto 0;" onclick="openFeedback()">💬 App feedback — what works, what doesn't</button>
    <div class="foot">Questions? Use 💬 Ask / Remark above, or call or text Eric directly.</div>`;
  $('#app').innerHTML = h;
  loadAsks(false); // 💬 their open questions + the three lamps
  // 📋 the materials board comes alive when Eric has published one
  loadMat().then(() => {
    if (!_mat || !_mat.rooms.length) return;
    const tile = document.getElementById('matTile');
    const rib = document.getElementById('matRibbon');
    if (rib) rib.remove();
    if (tile) { tile.classList.add('live'); tile.onclick = () => { renderMat(); matOpenFS(); }; }
    updateMatTile();
  });
  ping('open');
}
boot();
</script>
</body>
</html>
