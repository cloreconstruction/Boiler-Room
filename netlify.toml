[functions]
  directory = "netlify/functions"
  node_bundler = "none"

# 🌙🅿 v5.26 — plan-reminder schedule PARKED with the Plan-tomorrow feature (Eric: refine later).
# Restore the [functions."plan-reminder"] schedule block to bring the 5pm nudge back.

# 🔒 v6.26 — the repo root IS the live site, so every file in git was also a public URL.
# CLAUDE.md and the test suites belong in git, not on the web address. 404 them.
# Eric: "they don't need to be readable on your live website." Blocking here, not in
# _headers — _headers only sets headers, it cannot refuse a file.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
